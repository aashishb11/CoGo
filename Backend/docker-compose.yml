# Local development database.
#
# Usage: docker compose up -d
#
# Starts a local PostgreSQL instance on port 5432.
# Run the app separately with: pnpm start:dev

services:
  db:
    image: postgres:17-alpine
    container_name: cogo-backend-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cogo
      POSTGRES_PASSWORD: cogo
      POSTGRES_DB: cogo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cogo -d cogo']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
