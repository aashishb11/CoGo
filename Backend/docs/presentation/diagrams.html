<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CoGo · Data Model Walkthrough</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #0f172a;
      --ink-soft: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.05);
      --radius: 10px;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand .sub {
      font-size: 13px;
      color: var(--muted);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .toggle {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
    }
    .toggle button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font: 500 13px var(--sans);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }
    .toggle button.active {
      background: var(--ink);
      color: #fff;
    }
    .counter {
      color: var(--muted);
      font: 500 12px var(--mono);
    }

    main {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 0;
    }
    nav {
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: 16px 12px;
    }
    nav h2 {
      margin: 0 8px 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    nav li button {
      width: 100%;
      text-align: left;
      appearance: none;
      border: 0;
      background: transparent;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--ink-soft);
      font: 500 14px var(--sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 120ms, color 120ms;
    }
    nav li button:hover {
      background: var(--bg);
    }
    nav li button.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    nav li .num {
      font: 600 11px var(--mono);
      color: var(--muted);
      min-width: 18px;
    }
    nav li button.active .num {
      color: var(--accent);
    }
    nav .group-label {
      margin: 14px 8px 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stage {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
    }
    .stage-header {
      padding: 18px 28px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .stage-header h2 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }
    .stage-header .desc {
      margin: 0;
      color: var(--muted);
      max-width: 80ch;
      font-size: 14px;
    }
    .stage-body {
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: 0;
      overflow: hidden;
    }
    .diagram-wrap {
      overflow: auto;
      padding: 24px;
      background:
        radial-gradient(circle at 1px 1px, #e2e8f0 1px, transparent 0) 0 0 / 24px 24px,
        var(--bg);
    }
    .diagram-wrap > .diagram {
      display: inline-block;
      min-width: 100%;
    }
    .diagram svg {
      max-width: 100%;
      height: auto !important;
      display: block;
      margin: 0 auto;
    }
    .diagram-empty {
      color: var(--muted);
      font-size: 14px;
      padding: 40px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    aside {
      border-left: 1px solid var(--line);
      background: var(--panel);
      overflow-y: auto;
      padding: 20px 22px;
    }
    aside h3 {
      margin: 0 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    aside ul {
      margin: 0 0 18px;
      padding-left: 18px;
      color: var(--ink-soft);
    }
    aside li {
      margin-bottom: 6px;
      font-size: 13.5px;
    }
    aside code {
      font: 500 12.5px var(--mono);
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--ink);
    }
    aside .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }
    aside .pill {
      font: 500 11.5px var(--mono);
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink-soft);
    }

    footer {
      grid-column: 1 / -1;
      display: none;
    }

    .kbd {
      font: 500 11px var(--mono);
      background: var(--bg);
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      padding: 2px 6px;
      border-radius: 5px;
      color: var(--ink-soft);
    }
    .nav-hint {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      .stage-body { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>CoGo · Data Model</h1>
      <span class="sub">conceptual &amp; database walkthrough</span>
    </div>
    <div class="controls">
      <span class="nav-hint">
        <span class="kbd">←</span> <span class="kbd">→</span> navigate ·
        <span class="kbd">C</span>/<span class="kbd">D</span> swap view
      </span>
      <div class="toggle" id="view-toggle" role="tablist" aria-label="View">
        <button type="button" data-view="conceptual" class="active" role="tab">Conceptual</button>
        <button type="button" data-view="db" role="tab">Database</button>
      </div>
      <span class="counter" id="counter">1 / 10</span>
    </div>
  </header>

  <main>
    <nav>
      <h2>Modules</h2>
      <ul id="module-list"></ul>
    </nav>

    <section class="stage">
      <div class="stage-header">
        <h2 id="module-title"></h2>
        <p id="module-desc" class="desc"></p>
      </div>
      <div class="stage-body">
        <div class="diagram-wrap">
          <div id="diagram" class="diagram"></div>
        </div>
        <aside>
          <h3>Entities in this view</h3>
          <div id="entities" class="pill-row"></div>
          <h3>Key relationships</h3>
          <ul id="relations"></ul>
          <h3>Worth saying out loud</h3>
          <ul id="notes"></ul>
        </aside>
      </div>
    </section>
  </main>

  <script>
    // -------------------------------------------------------------------------
    // Module definitions. Each module has an id, a title, a short presenter
    // description, and per-view (conceptual / db) mermaid source plus the
    // sidebar metadata. Boundary entities are intentionally left out of each
    // module's diagram — modules show what *belongs* to that domain plus the
    // minimum scaffolding needed to make the relationships legible.
    // -------------------------------------------------------------------------

    const MODULES = [
      // ---------------------------------------------------------------------
      {
        id: 'overview',
        title: 'Overview',
        group: 'Big picture',
        desc: 'How the seven domains fit together. Each box becomes its own slide; the arrows show the direction of dependency.',
        entities: ['Identity', 'Trips', 'Rides', 'Chat', 'Wallet', 'Safety', 'Ratings'],
        relations: [
          'Trips are templates; Rides are their frozen, dated instances.',
          'Bookings, Chat, Safety and Ratings all attach to a Ride.',
          'Wallet sits sideways: holds reserve funds at booking accept; captures fire at boarding.',
        ],
        notes: [
          'The conceptual diagram models what the *business* cares about; the DB diagram adds platform plumbing (auth, push, agenda token).',
          'Trip inheritance (Sporadic / Recurring) is a class hierarchy at the conceptual level and a single-table discriminator (`type`) at the DB level.',
        ],
        conceptual: `flowchart TB
  classDef domain fill:#ffffff,stroke:#2563eb,stroke-width:1.5px,color:#0f172a,rx:8,ry:8;
  classDef center fill:#dbeafe,stroke:#2563eb,stroke-width:2px,color:#0f172a,rx:8,ry:8;

  ID[Identity &amp; Profile<br/><i>User · Profile · Organization · Badge</i>]:::domain
  TR[Trips &amp; Vehicles<br/><i>Trip · Sporadic / Recurring · Car · CarModel · Location</i>]:::domain
  RB[Rides &amp; Bookings<br/><i>Ride · Booking</i>]:::center
  CH[Chat<br/><i>TripChatThread · ChatMessage</i>]:::domain
  WA[Wallet<br/><i>Wallet · WalletHold</i>]:::domain
  SA[Safety<br/><i>TrustedContact · SafetyIncident</i>]:::domain
  RA[Ratings<br/><i>Rating</i>]:::domain

  ID --> TR
  ID --> WA
  ID --> SA
  ID --> RA
  TR --> RB
  TR --> CH
  RB --> CH
  RB --> SA
  RB --> RA
  RB --> WA
`,
        db: `flowchart TB
  classDef domain fill:#ffffff,stroke:#2563eb,stroke-width:1.5px,color:#0f172a,rx:8,ry:8;
  classDef center fill:#dbeafe,stroke:#2563eb,stroke-width:2px,color:#0f172a,rx:8,ry:8;
  classDef plat fill:#f1f5f9,stroke:#94a3b8,stroke-dasharray:4 3,color:#334155,rx:8,ry:8;

  ID[Identity &amp; Profile<br/><i>users · organizations · profiles</i>]:::domain
  AU[Auth &amp; Devices<br/><i>sessions · accounts · verification · push_subscriptions</i>]:::plat
  TR[Trips &amp; Vehicles<br/><i>trips · cars · car_models · user_favorite_trips</i>]:::domain
  RB[Rides &amp; Bookings<br/><i>rides · bookings</i>]:::center
  CH[Chat<br/><i>chat_threads · chat_messages</i>]:::domain
  WA[Wallet<br/><i>wallets · wallet_transactions · wallet_holds</i>]:::domain
  SA[Safety<br/><i>trusted_contacts · safety_incidents</i>]:::domain
  RA[Ratings<br/><i>user_ratings</i>]:::domain

  ID --> AU
  ID --> TR
  ID --> WA
  ID --> SA
  ID --> RA
  TR --> RB
  TR --> CH
  RB --> CH
  RB --> SA
  RB --> RA
  RB --> WA
`,
      },

      // ---------------------------------------------------------------------
      {
        id: 'identity',
        title: 'Identity & Profile',
        group: 'Domain modules',
        desc: 'Who the user is, what they look like in the app, and the optional organization they belong to. Gamification (CO₂ / XP / badges) lives on Profile.',
        entities: ['User', 'Profile', 'Organization', 'Badge'],
        relations: [
          'User 1 ↔ 1 Profile — same lifetime, profile is PK = user_id at the DB level.',
          'Organization 0..1 → 0..* User — optional; users without org are personal accounts.',
          'Profile.badges is a JSONB array of { id, awardedAt } — no separate table.',
        ],
        notes: [
          'totalCo2Saved, xpPoints, ride counters and badges are all maintained as a single side-effect of Ride.complete().',
          'level is derived: floor(sqrt(xpPoints / 100)) — never stored.',
          'Per-user CO₂ over-counts on purpose (feel-good metric). For platform totals, sum Ride.actualCo2SavedKg directly.',
        ],
        conceptual: `classDiagram
direction LR
  class User {
    +id: String
    +name: String
    +email: String
    +image: String
    +createdAt: DateTime
  }
  class Profile {
    +id: String
    +username: String
    +bio: String
    +phone: String
    +locale: String
    +totalCo2Saved: Double
    +xpPoints: Integer
    +ridesAsDriver: Integer
    +ridesAsPassenger: Integer
    +badges: List~Badge~
    +/level: Integer
  }
  class Organization {
    +id: String
    +name: String
    +domain: String
  }
  class Badge {
    +id: String
    +awardedAt: DateTime
  }
  note for Profile "level = floor(sqrt(xpPoints / 100))"
  note for Badge "Stored inline on Profile as JSONB."

  User "1" --> "1" Profile : has
  Organization "0..1" --> "0..*" User : contains
  Profile "1" --> "0..*" Badge : earns
`,
        db: `classDiagram
direction LR
  class organizations {
    uuid id
    text name
    text domain
    timestamp created_at
    timestamp updated_at
  }
  class users {
    uuid id
    uuid organization_id
    text email
    text name
    boolean email_verified
    text image
    text role
    boolean banned
    text ban_reason
    timestamp ban_expires
    text agenda_feed_token
    timestamp created_at
  }
  class profiles {
    uuid user_id
    text username
    text bio
    text phone
    text locale
    double total_co2_saved
    integer xp_points
    integer rides_as_driver
    integer rides_as_passenger
    jsonb badges
    timestamp created_at
    timestamp updated_at
  }

  organizations "0..1" --> "0..*" users : organization_id
  users "1" --> "1" profiles : user_id
`,
      },

      // ---------------------------------------------------------------------
      {
        id: 'auth',
        title: 'Auth & Devices',
        group: 'Domain modules',
        desc: 'Better-auth tables (sessions, providers, email verification) and the per-device push subscriptions. These are platform concerns — not modelled at the conceptual level.',
        entities: ['sessions', 'accounts', 'verification', 'push_subscriptions'],
        relations: [
          'sessions, accounts, push_subscriptions all reference users (user_id).',
          'verification is identifier-keyed (email / phone), not user-keyed.',
          'push_subscriptions is per-device — one user can have many rows (phone + tablet + browser).',
        ],
        notes: [
          'agenda_feed_token lives on users — null until first /me/agenda/feed request; rotatable.',
          'There is no conceptual diagram for this module — these tables exist because we run on the web, not because the domain calls for them.',
        ],
        conceptual: null,
        db: `classDiagram
direction LR
  class users {
    uuid id
    text email
    text agenda_feed_token
  }
  class sessions {
    uuid id
    uuid user_id
    text token
    timestamp expires_at
  }
  class accounts {
    uuid id
    uuid user_id
    text provider_id
    text account_id
    text access_token
    text refresh_token
  }
  class verification {
    uuid id
    text identifier
    text value
    timestamp expires_at
  }
  class push_subscriptions {
    uuid id
    uuid user_id
    text endpoint
    jsonb keys
    jsonb settings
    timestamp created_at
    timestamp updated_at
  }

  users "1" --> "0..*" sessions : user_id
  users "1" --> "0..*" accounts : user_id
  users "1" --> "0..*" push_subscriptions : user_id
`,
      },

      // ---------------------------------------------------------------------
      {
        id: 'trips',
        title: 'Trips & Vehicles',
        group: 'Domain modules',
        desc: 'Trip is the contract template — the driver, the car, the route, the schedule, the cabin preferences. SporadicTrip is one departure; RecurringTrip is a calendar pattern.',
        entities: ['Trip', 'SporadicTrip', 'RecurringTrip', 'Car', 'CarModel', 'Location'],
        relations: [
          'Trip is abstract — exactly one of SporadicTrip / RecurringTrip per row.',
          'Trip uses 1 Car; Car is_a 1 CarModel. CO₂ math reads co2KgPerKm off the model.',
          'Trip has 1 origin Location + 1 destination Location (snapshotted onto each Ride).',
          'User → favorites → Trip is many-to-many.',
        ],
        notes: [
          'At the DB level, Trip uses single-table inheritance: `type` discriminates; `departure_at` is non-null for sporadic, `schedule jsonb` for recurring.',
          'Recurring trips pre-generate the full ride horizon at creation.',
          'Cars and car_models are soft-deleted reference data so ride history never orphans.',
        ],
        conceptual: `classDiagram
direction TB
  class Trip {
    <<abstract>>
    +id: String
    +status: TripStatus
    +seatsOffered: Integer
    +totalDistanceKm: Double
    +estimatedDurationMinutes: Integer
    +routePolyline: String
    +/estimatedCo2SavingsPerSeatKg: Double
    +conversationStyle: ConversationStyle
    +smokeAllowed: Boolean
    +musicAllowed: Boolean
    +musicGenre: MusicGenre
    +cancelledAt: DateTime
    +archivedAt: DateTime
  }
  class SporadicTrip { +departureAt: DateTime }
  class RecurringTrip {
    +startDate: Date
    +endDate: Date
    +daysOfWeek: Map~DayOfWeek,Boolean~
    +timeOfDay: Time
  }
  class Car {
    +id: String
    +plate: String
    +color: String
    +passengerSeats: Integer
  }
  class CarModel {
    +id: String
    +brand: String
    +name: String
    +year: Integer
    +type: String
    +co2KgPerKm: Double
  }
  class Location {
    +label: String
    +latitude: Double
    +longitude: Double
  }
  class TripStatus { <<enumeration>> ACTIVE, CANCELLED, ARCHIVED }
  class ConversationStyle { <<enumeration>> QUIET, CASUAL, CHATTY }
  class MusicGenre { <<enumeration>> POP, ROCK, REGGAETON, INDIE, NONE }

  Trip <|-- SporadicTrip
  Trip <|-- RecurringTrip
  Trip "0..*" --> "1" Car : uses
  Trip "1" --> "1" Location : origin
  Trip "1" --> "1" Location : destination
  Car "0..*" --> "1" CarModel : is a
`,
        db: `classDiagram
direction TB
  class trips {
    uuid id
    uuid driver_id
    uuid car_id
    text type
    jsonb schedule
    timestamp departure_at
    text origin_label
    double origin_lat
    double origin_lng
    text destination_label
    double destination_lat
    double destination_lng
    integer seats_offered
    integer price_per_seat_cents
    double total_distance_km
    integer estimated_duration_minutes
    text route_polyline
    text conversation_style
    boolean smoke_allowed
    boolean music_allowed
    text music_genre
    text status
    timestamp cancelled_at
    text cancellation_reason
    timestamp archived_at
  }
  class cars {
    uuid id
    uuid user_id
    uuid model_id
    text plate
    text color
    integer passenger_seats
  }
  class car_models {
    uuid id
    text brand
    text name
    integer year
    text type
    double co2_kg_per_km
  }
  class user_favorite_trips {
    uuid user_id
    uuid trip_id
  }

  car_models "1" --> "0..*" cars : model_id
  cars "1" --> "0..*" trips : car_id
  trips "1" --> "0..*" user_favorite_trips : trip_id
`,
      },

      // ---------------------------------------------------------------------
      {
        id: 'rides',
        title: 'Rides & Bookings',
        group: 'Domain modules',
        desc: 'Ride is the frozen, dated instance of a Trip. Booking is a passenger asking for a seat on a specific Ride. This is the heart of the model.',
        entities: ['Ride', 'Booking'],
        relations: [
          'Trip 1 → 1..* Ride — generated up front (sporadic = 1, recurring = full horizon).',
          'Ride 1 → 0..* Booking — same passenger may have multiple bookings across rides of the same trip ("batch").',
          'Booking targets exactly one Ride; passenger must not be the trip driver.',
        ],
        notes: [
          'Origin / destination / distance / seatsOffered / actualCo2SavedKg are snapshotted onto each Ride. Once completed or cancelled, the snapshot is frozen forever.',
          'Booking state machine: PENDING → ACCEPTED → (boarded / no-show) ; or REJECTED / CANCELLED / EXPIRED.',
          'Pending bookings auto-EXPIRE via a periodic sweep once the ride departs without action.',
          'Booking resolution is funnelled through markBookingResolved() — that\'s the single seam that also releases wallet holds.',
        ],
        conceptual: `classDiagram
direction TB
  class Trip {
    <<abstract>>
    +status: TripStatus
  }
  class Ride {
    +id: String
    +scheduledDeparture: DateTime
    +originLabel: String
    +originLat: Double
    +originLng: Double
    +destinationLabel: String
    +destinationLat: Double
    +destinationLng: Double
    +totalDistanceKm: Double
    +status: RideStatus
    +seatsOffered: Integer
    +seatsOccupied: Integer
    +actualCo2SavedKg: Double
    +completedAt: DateTime
    +cancelledAt: DateTime
    +cancellationReason: String
  }
  class Booking {
    +id: String
    +status: BookingStatus
    +message: String
    +requestedAt: DateTime
    +acceptedAt: DateTime
    +rejectedAt: DateTime
    +cancelledAt: DateTime
  }
  class RideStatus { <<enumeration>> ACTIVE, IN_PROGRESS, CANCELLED, COMPLETED }
  class BookingStatus { <<enumeration>> PENDING, ACCEPTED, REJECTED, CANCELLED, EXPIRED }

  Trip "1" --> "1..*" Ride : generates
  Ride "1" --> "0..*" Booking : has
  note for Ride "Snapshot of Trip at generation.<br/>Cascade: trip CANCELLED ⇒ ride CANCELLED ⇒ active bookings REJECTED."
  note for Booking "batchAccept / batchReject operate on<br/>all bookings sharing (passenger, trip)."
`,
        db: `classDiagram
direction TB
  class trips {
    uuid id
    text status
  }
  class rides {
    uuid id
    uuid trip_id
    timestamp scheduled_departure
    text origin_label
    double origin_lat
    double origin_lng
    text destination_label
    double destination_lat
    double destination_lng
    double total_distance_km
    text status
    integer seats_offered
    integer seats_occupied
    double actual_co2_saved_kg
    timestamp started_at
    boolean flagged_for_review
    timestamp completed_at
    timestamp cancelled_at
    text cancellation_reason
  }
  class bookings {
    uuid id
    uuid passenger_id
    uuid ride_id
    text status
    text message
    integer fare_cents
    timestamp requested_at
    timestamp accepted_at
    timestamp rejected_at
    timestamp cancelled_at
    timestamp boarded_at
  }

  trips "1" --> "0..*" rides : trip_id
  rides "1" --> "0..*" bookings : ride_id
`,
      },

      // ---------------------------------------------------------------------
      {
        id: 'chat',
        title: 'Chat',
        group: 'Domain modules',
        desc: 'One driver-to-passenger thread per Trip (not per Ride). Recurring trips keep a single continuous conversation across all generated rides.',
        entities: ['TripChatThread', 'ChatMessage'],
        relations: [
          'Trip 1 → 0..* TripChatThread — one per passenger.',
          'TripChatThread 1 → 0..* ChatMessage.',
          'ChatMessage may optionally reference a Ride to scope the message to one occurrence.',

    // -------------------------------------------------------------------------
    // Rendering & navigation
    // -------------------------------------------------------------------------

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        background: '#ffffff',
        primaryColor: '#ffffff',
        primaryTextColor: '#0f172a',
        primaryBorderColor: '#94a3b8',
        secondaryColor: '#f1f5f9',
        tertiaryColor: '#f8fafc',
        lineColor: '#475569',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif',
        fontSize: '14px',
        classText: '#0f172a',
        noteBkgColor: '#fef9c3',
        noteBorderColor: '#eab308',
        noteTextColor: '#422006',
      },
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
      class: { useMaxWidth: true },
    });

    const state = {
      view: 'conceptual',
      index: 0,
    };

    const els = {
      list: document.getElementById('module-list'),
      title: document.getElementById('module-title'),
      desc: document.getElementById('module-desc'),
      diagram: document.getElementById('diagram'),
      entities: document.getElementById('entities'),
      relations: document.getElementById('relations'),
      notes: document.getElementById('notes'),
      counter: document.getElementById('counter'),
      toggle: document.getElementById('view-toggle'),
    };

    function buildNav() {
      const groups = {};
      MODULES.forEach((m, i) => {
        (groups[m.group] ||= []).push({ ...m, _i: i });
      });
      let html = '';
      let firstGroup = true;
      for (const [group, items] of Object.entries(groups)) {
        if (!firstGroup) {
          html += `<div class="group-label">${group}</div>`;
        } else {
          firstGroup = false;
        }
        for (const m of items) {
          html += `<li><button data-i="${m._i}"><span class="num">${String(m._i + 1).padStart(2, '0')}</span><span>${m.title}</span></button></li>`;
        }
      }
      els.list.innerHTML = html;
      els.list.querySelectorAll('button').forEach((b) => {
        b.addEventListener('click', () => go(Number(b.dataset.i)));
      });
    }

    async function render() {
      const m = MODULES[state.index];
      const source = m[state.view];

      els.title.textContent = m.title;
      els.desc.textContent = m.desc;
      els.counter.textContent = `${state.index + 1} / ${MODULES.length}`;

      els.list.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('active', Number(b.dataset.i) === state.index);
      });
      els.toggle.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('active', b.dataset.view === state.view);
      });

      els.entities.innerHTML = m.entities
        .map((e) => `<span class="pill">${e}</span>`)
        .join('');
      els.relations.innerHTML = m.relations.map((r) => `<li>${r}</li>`).join('');
      els.notes.innerHTML = m.notes.map((n) => `<li>${n}</li>`).join('');

      if (!source) {
        els.diagram.innerHTML = `<div class="diagram-empty">
          Not modeled at the ${state.view} level.<br/>
          ${state.view === 'conceptual'
            ? 'These tables exist for platform reasons (auth, devices); they don\'t represent business concepts.'
            : 'See the conceptual view.'}
        </div>`;
        return;
      }

      els.diagram.innerHTML = '<div style="color:var(--muted);padding:20px;">rendering…</div>';
      try {
        const id = `mmd-${state.index}-${state.view}`;
        const { svg } = await mermaid.render(id, source);
        els.diagram.innerHTML = svg;
      } catch (err) {
        els.diagram.innerHTML = `<pre style="color:#b91c1c;white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:#fef2f2;padding:16px;border-radius:8px;border:1px solid #fecaca;">${String(err && err.message || err)}</pre>`;
      }
    }

    function go(i) {
      state.index = Math.max(0, Math.min(MODULES.length - 1, i));
      render();
    }

    function setView(view) {
      if (view !== state.view) {
        state.view = view;
        render();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.index - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); go(state.index + 1); }
      else if (e.key === 'c' || e.key === 'C') setView('conceptual');
      else if (e.key === 'd' || e.key === 'D') setView('db');
    });

    els.toggle.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-view]');
      if (btn) setView(btn.dataset.view);
    });

    buildNav();
    render();
  </script>
